# Final HTTP configuration: install after the HTTPS virtual host is ready.
<VirtualHost *:80>
    ServerName positorium.com
    ServerAlias www.positorium.com
    ServerAdmin root@subside.com

    DocumentRoot /var/www/www.positorium.com
    DirectoryIndex index.html

    <Directory /var/www/www.positorium.com>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Keep HTTP-01 validation available for certificate renewal.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://positorium.com%{REQUEST_URI} [R=301,L,NE]

    LogLevel warn
    ErrorLog /var/log/apache2/http.www.positorium.com-error.log
    CustomLog /var/log/apache2/http.www.positorium.com.log combined
</VirtualHost>
