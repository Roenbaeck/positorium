# Install only after Certbot has created the certificate files below.
<VirtualHost *:443>
    ServerName positorium.com
    ServerAlias www.positorium.com
    ServerAdmin root@subside.com

    DocumentRoot /var/www/www.positorium.com
    DirectoryIndex index.html

    <Directory /var/www/www.positorium.com>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/positorium.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/positorium.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # The website's canonical URL is https://positorium.com/.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.positorium\.com(?::443)?$ [NC]
    RewriteRule ^ https://positorium.com%{REQUEST_URI} [R=301,L,NE]

    # Required for ES modules, module workers, and streaming WASM compilation.
    AddType application/wasm .wasm
    AddType text/javascript .js

    # Revalidate assets whose filenames are reused between website builds.
    <FilesMatch "\.(html|css|js|wasm)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    LogLevel warn
    ErrorLog /var/log/apache2/https.www.positorium.com-error.log
    CustomLog /var/log/apache2/https.www.positorium.com.log combined
</VirtualHost>
