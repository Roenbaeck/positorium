[package]
name = "positorium"
version = "0.1.4-beta.1"
edition = "2024"
authors = ["Lars Rönnbäck <lars@positorium.com>"]
license = "MIT OR Apache-2.0"
description = "Experimental transitional database for conflicting and evolving information"
repository = "https://github.com/Roenbaeck/positorium"
readme = "README.md"
autobenches = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["server", "persistence", "cli"]
server = ["tokio", "axum", "tokio-stream", "futures-util", "tower-http"]
persistence = ["getrandom"]
cli = ["config"]
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "getrandom/wasm_js"]

[dependencies]
# core dependencies
chrono = "0.4.38"
bimap = "0.6.3"
pest = "2.8"
pest_derive = "2.8"
regex = "1.10"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roaring = "0.11"
seahash = "4.1.0"
bigdecimal = "0.4"
jsondata = "0.8.1"
lazy_static = "1.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
unicode-normalization = "0.1"
wasm-bindgen = { version = "0.2.100", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
getrandom = { version = "0.4", optional = true }

# Optional dependencies for features
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"], optional = true }
axum = { version = "0.8.6", features = ["ws"], optional = true }
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }
config = { version = "0.15.18", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
wasm-bindgen-test = "0.3"

[[bench]]
name = "benchmark"
harness = false

[[bin]]
name = "positorium-store"
path = "src/bin/positorium-store.rs"
required-features = ["persistence"]
