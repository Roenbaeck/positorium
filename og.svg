<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Positorium — A database for facts that disagree</title>
  <desc id="description">Two sources retain different assessments of the same organisation, each with certainty and provenance.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#eee7dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#463d34" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <path d="M0 88H1200M0 542H1200M70 0V630M1130 0V630" stroke="#d7cec2" stroke-width="1" opacity="0.55"/>
  <circle cx="70" cy="88" r="5" fill="#982a35"/>
  <circle cx="1130" cy="542" r="5" fill="#982a35"/>

  <g transform="translate(76 66)">
    <rect width="46" height="46" rx="12" fill="#1d1b19"/>
    <text x="23" y="32" fill="#fffaf1" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" text-anchor="middle">P</text>
    <text x="62" y="20" fill="#1d1b19" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700">Positorium</text>
    <text x="62" y="40" fill="#777067" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">EVIDENCE DATABASE</text>
  </g>

  <g transform="translate(76 174)">
    <text fill="#1d1b19" font-family="Georgia, 'Times New Roman', serif" font-size="61" font-weight="700" letter-spacing="-1.5">
      <tspan x="0" y="0">A database for</tspan>
      <tspan x="0" y="70">facts that disagree.</tspan>
    </text>
    <rect x="0" y="102" width="74" height="5" rx="2.5" fill="#982a35"/>
    <text x="0" y="150" fill="#575149" font-family="Arial, Helvetica, sans-serif" font-size="23">
      <tspan x="0" dy="0">Preserve every claim with its source,</tspan>
      <tspan x="0" dy="34">time, and certainty.</tspan>
    </text>
    <text x="0" y="263" fill="#777067" font-family="Arial, Helvetica, sans-serif" font-size="17">Corrections append. Evidence remains.</text>
  </g>

  <g transform="translate(720 93)" filter="url(#shadow)">
    <rect width="404" height="444" rx="24" fill="#ffffff" stroke="#d7cec2"/>
    <text x="30" y="44" fill="#982a35" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CURRENT EVIDENCE</text>
    <text x="30" y="78" fill="#1d1b19" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">Northstar Trading</text>
    <line x1="30" y1="101" x2="374" y2="101" stroke="#e4ddd3"/>

    <g transform="translate(30 128)">
      <rect width="344" height="101" rx="15" fill="#f7f1ea" stroke="#dfd5c8"/>
      <circle cx="24" cy="25" r="7" fill="#982a35"/>
      <text x="43" y="30" fill="#5f5952" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Automated screening feed</text>
      <text x="20" y="67" fill="#1d1b19" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">“high risk”</text>
      <rect x="268" y="54" width="56" height="25" rx="12.5" fill="#f3e4e4"/>
      <text x="296" y="72" fill="#982a35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">88%</text>
    </g>

    <g transform="translate(30 247)">
      <rect width="344" height="101" rx="15" fill="#f2f5f0" stroke="#d4ddd1"/>
      <circle cx="24" cy="25" r="7" fill="#3d7855"/>
      <text x="43" y="30" fill="#5f5952" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Human analyst</text>
      <text x="20" y="67" fill="#1d1b19" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">“needs review”</text>
      <rect x="268" y="54" width="56" height="25" rx="12.5" fill="#e5efe8"/>
      <text x="296" y="72" fill="#3d7855" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">96%</text>
    </g>

    <g transform="translate(30 375)">
      <text x="0" y="17" fill="#9b9389" font-family="Arial, Helvetica, sans-serif" font-size="13">Earlier analyst claim</text>
      <text x="150" y="17" fill="#9b9389" font-family="Arial, Helvetica, sans-serif" font-size="13" text-decoration="line-through">“low risk”</text>
      <rect x="281" y="0" width="43" height="23" rx="11.5" fill="#eeeae3"/>
      <text x="302.5" y="16" fill="#777067" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">0%</text>
    </g>
  </g>
</svg>
