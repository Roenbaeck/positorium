name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup show active-toolchain
      - name: Test default feature set
        run: cargo test --all-targets --all-features --no-fail-fast
      - name: Test in-memory feature set
        run: cargo test --all-targets --no-default-features --no-fail-fast

  quality:
    name: Formatting and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Lint in-memory feature set
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Check in-memory WASM build
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Run browser smoke tests
        run: wasm-pack test --headless --chrome . --no-default-features --features wasm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the self-hosted website and deployment bundles
        run: python3 scripts/build_website.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website test dependencies
        working-directory: website
        run: npm ci
      - name: Install website test browser
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Test the website and WASM playground
        working-directory: website
        run: npm run test:all
