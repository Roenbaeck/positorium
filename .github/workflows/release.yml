name: Native release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and curated release notes
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v${package_version}"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Lint in-memory feature set
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test all features
        run: cargo test --all-targets --all-features --no-fail-fast
      - name: Test in-memory feature set
        run: cargo test --all-targets --no-default-features --no-fail-fast
      - name: Test Terrain client
        run: node tests/terrain_client.test.js
      - name: Install stable WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Test WASM in Chrome
        run: wasm-pack test --headless --chrome . --no-default-features --features wasm

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            archive: tar
          - os: macos-14
            label: macos-aarch64
            archive: tar
          - os: windows-latest
            label: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release binaries
        run: cargo build --release --all-features --bins --locked
      - name: Archive Unix binaries
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist/package/traqula
          cp target/release/positorium target/release/positorium-store dist/package/
          cp positorium.json README.md LICENSE.MIT LICENSE.Apache-2.0 dist/package/
          cp traqula/empty.traqula dist/package/traqula/
          cp -R docs dist/package/
          archive="positorium-${GITHUB_REF_NAME}-${{ matrix.label }}.tar.gz"
          tar -czf "dist/${archive}" -C dist/package .
          (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
      - name: Archive Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package/traqula | Out-Null
          Copy-Item target/release/positorium.exe,target/release/positorium-store.exe -Destination dist/package
          Copy-Item positorium.json,README.md,LICENSE.MIT,LICENSE.Apache-2.0 -Destination dist/package
          Copy-Item traqula/empty.traqula -Destination dist/package/traqula
          Copy-Item docs -Destination dist/package -Recurse
          $archive = "positorium-$env:GITHUB_REF_NAME-${{ matrix.label }}.zip"
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline "dist/$archive.sha256"
      - name: Smoke-test Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf dist/*.tar.gz -C "$smoke_dir"
          cd "$smoke_dir"
          ./positorium >smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$smoke_dir"' EXIT
          ready=0
          for _ in {1..40}; do
            if curl --silent --fail http://127.0.0.1:8080/v1/query \
              -H 'content-type: application/json' \
              --data '{"traqula_version":1,"script":"add role release_smoke; add posit [{(+thing, release_smoke)}, \"ok\", @NOW]; search [{(?thing, release_smoke), ...}, ?value, *] return ?value;","stream":false}' \
              >response.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat smoke.log
              exit 1
            fi
            sleep 0.25
          done
          test "$ready" = 1
          grep -q '"status":"ok"' response.json
          kill -TERM "$server_pid"
          wait "$server_pid"
      - name: Smoke-test Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "positorium-smoke-$env:GITHUB_RUN_ID"
          Expand-Archive -Path (Get-ChildItem dist/*.zip).FullName -DestinationPath $smokeDir
          $stdout = Join-Path $smokeDir "smoke.out"
          $stderr = Join-Path $smokeDir "smoke.err"
          $process = Start-Process -FilePath (Join-Path $smokeDir "positorium.exe") -WorkingDirectory $smokeDir -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($process.HasExited) {
                Get-Content $stdout,$stderr
                throw "positorium exited before the smoke request"
              }
              try {
                $body = '{"traqula_version":1,"script":"add role release_smoke; add posit [{(+thing, release_smoke)}, \"ok\", @NOW]; search [{(?thing, release_smoke), ...}, ?value, *] return ?value;","stream":false}'
                $response = Invoke-RestMethod -Uri http://127.0.0.1:8080/v1/query -Method Post -ContentType application/json -Body $body
                $ready = $response.status -eq "ok"
                if ($ready) { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "positorium did not become ready" }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
            Remove-Item $smokeDir -Recurse -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: positorium-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release with generated changelog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          notes="$(cat "$notes_file")"
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --notes "$notes" --title "$GITHUB_REF_NAME" "${prerelease[@]}"
