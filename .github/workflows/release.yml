name: Native release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and curated release notes
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v${package_version}"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Lint in-memory feature set
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test all features
        run: cargo test --all-targets --all-features --no-fail-fast
      - name: Test in-memory feature set
        run: cargo test --all-targets --no-default-features --no-fail-fast
      - name: Test Terrain client
        run: node tests/terrain_client.test.js
      - name: Install stable WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Test WASM in Chrome
        run: wasm-pack test --headless --chrome . --no-default-features --features wasm

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-15
            label: macos-aarch64
          - os: windows-latest
            label: windows-x86_64
    uses: ./.github/workflows/native-archive.yml
    with:
      os: ${{ matrix.os }}
      label: ${{ matrix.label }}
      version: ${{ github.ref_name }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release with generated changelog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --notes-file "$notes_file" --title "$GITHUB_REF_NAME" "${prerelease[@]}"
