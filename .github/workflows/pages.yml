name: WASM testbed

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "positorium.html"
      - "positorium.css"
      - "og.png"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Browser smoke tests
        run: wasm-pack test --headless --chrome . --no-default-features --features wasm
      - name: Build web package
        run: wasm-pack build --release --target web --out-dir pkg . --no-default-features --features wasm
      - name: Assemble zero-install testbed
        shell: bash
        run: |
          mkdir site
          cp positorium.html site/index.html
          cp positorium.css og.png site/
          cp -R pkg site/pkg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
